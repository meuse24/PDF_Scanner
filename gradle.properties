# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Muss mit ~/.gradle/gradle.properties identisch sein (höhere Priorität),
# damit IDE und CLI denselben Daemon verwenden (sonst starten zwei Instanzen).
# G1GC + Xms4GB + G1HeapRegionSize=16m; JBR 21.0.10 unterstützt kein ZGC.
org.gradle.jvmargs=-Xmx8192m -Xms4096m -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:G1HeapRegionSize=16m -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 10 von 12 CPU-Threads für Worker (2 Reserve für OS + Android Studio).
org.gradle.workers.max=10

# Configuration Cache: Konfigurationsphase wird gecacht – spart bei
# inkrementellen Builds typisch 5–15 s. AGP 9.1 unterstützt das vollständig.
org.gradle.configuration-cache=true
org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.java.installations.auto-download=false

# Kotlin-Daemon: Xms 256m → 2048m (war in ~/.gradle fälschlicherweise über
# kotlin.daemon.jvmargs gesetzt – falscher Property-Name, wurde ignoriert).
kotlin.daemon.jvm.options=-Xmx4096m -Xms2048m -XX:+UseG1GC -XX:G1HeapRegionSize=8m -Dfile.encoding=UTF-8

# Inkrementelle Kotlin-Kompilierung.
kotlin.incremental=true
# Classpath-Snapshot: nur bei echten API-Änderungen einer Dependency werden
# abhängige Dateien neu kompiliert (Kotlin 2.x, hier explizit gesetzt).
kotlin.incremental.useClasspathSnapshot=true
# Präzises Backup der Kompilierungsergebnisse (Kotlin 2.2+): verhindert
# unnötige Neu-Kompilierung bei Rollbacks und nach Cache-Restore.
kotlin.compiler.preciseCompilationResultsBackup=true
# VFS-Watch: Gradle-Daemon beobachtet Dateiänderungen aktiv statt bei jedem
# Build das Dateisystem vollständig zu scannen.
org.gradle.vfs.watch=true

kotlin.code.style=official
android.disallowKotlinSourceSets=false
android.suppressUnsupportedOptionWarnings=android.disallowKotlinSourceSets,android.suppressUnsupportedOptionWarnings
android.enableJetifier=false
android.nonTransitiveRClass=true
