# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# JVM-Heap von 4 auf 8 GB erhöht (32 GB RAM verfügbar).
# G1GC explizit gesetzt + SoftRefLRUPolicyMSPerMB=0 reduziert GC-Druck
# während KSP/Compose-Compiler-Läufen spürbar.
org.gradle.jvmargs=-Xmx8192m -Xms2048m -XX:MaxMetaspaceSize=2048m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=0 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# 10 von 12 CPU-Threads für Worker (2 Reserve für OS + Android Studio).
org.gradle.workers.max=10

# Configuration Cache: Konfigurationsphase wird gecacht – spart bei
# inkrementellen Builds typisch 5–15 s. AGP 9.1 unterstützt das vollständig.
org.gradle.configuration-cache=true
org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.java.installations.auto-download=false

# Kotlin-Daemon eigenen Heap geben – verhindert Contention mit Gradle-Daemon.
kotlin.daemon.jvm.options=-Xmx4096m -Xms256m

# Inkrementelle Kotlin-Kompilierung (Standard ab Kotlin 2, hier explizit).
kotlin.incremental=true

kotlin.code.style=official
android.disallowKotlinSourceSets=false
android.suppressUnsupportedOptionWarnings=android.disallowKotlinSourceSets,android.suppressUnsupportedOptionWarnings
android.enableJetifier=false
android.nonTransitiveRClass=true
